# Local copy of the MYNIX platform for testing the website against the POS.
# Sample data only — never production. Start everything with ./setup.sh.
name: mynix-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mynix_pos
      POSTGRES_USER: mynix
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?run ./setup.sh first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mynix -d mynix_pos"]
      interval: 3s
      retries: 20

  # Built from your local POS backend checkout (the branch you have open).
  pos-backend:
    build: ${POS_BACKEND_DIR:-../../../Mynix POS/backend}
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mynix_pos
      SPRING_DATASOURCE_USERNAME: mynix
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_DB_PASSWORD}
      JWT_SECRET: ${LOCAL_JWT_SECRET}
      TEXTLK_API_TOKEN: disabled-locally
      # Never send real SMS from the local copy.
      MYNIX_SMS_ENABLED: "false"
      # With SMS off, write verification codes to the backend log instead
      # (docker compose logs pos-backend | grep "verification code").
      MYNIX_OTP_LOG_CODES: "true"
      MYNIX_PUBLIC_INVOICE_BASE_URL: http://localhost:5173/invoice
      # Links in website-order SMS (invoice, tracking) point here.
      MYNIX_WEBSITE_URL: http://localhost:3000
      # Emergency admin reset test: MYNIX_RESET_ADMIN_PASSWORD=<new value> docker compose up -d pos-backend
      MYNIX_RESET_ADMIN_PASSWORD: ${MYNIX_RESET_ADMIN_PASSWORD:-}
      # Uploaded photos/videos go to the local S3 stand-in below (R2 in production).
      MEDIA_STORAGE_ENDPOINT: http://media:9090
      MEDIA_STORAGE_BUCKET: mynix-media
      MEDIA_STORAGE_ACCESS_KEY: local
      MEDIA_STORAGE_SECRET_KEY: local
      MEDIA_PUBLIC_BASE_URL: http://localhost:9090/mynix-media
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"

  # Local stand-in for Cloudflare R2 (S3 API). Files are readable at
  # http://localhost:9090/mynix-media/<key>, like R2's public bucket address.
  media:
    image: adobe/s3mock:latest
    # Test files are kept only while the container exists (local testing only).
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: mynix-media
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  pos-data:
